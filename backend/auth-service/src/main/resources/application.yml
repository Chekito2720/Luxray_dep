server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/auth_db
    username: ${PGUSER:luxray}
    password: ${PGPASSWORD:luxray_secret_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholders:
      # En producción las cuentas conocidas quedan inactivas desde V5.
      # Docker Compose lo cambia a false únicamente para desarrollo local.
      disableseedaccounts: ${DISABLE_SEED_ACCOUNTS:true}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

luxray:
  security:
    jwt:
      secret: ${JWT_SECRET:luxray-jwt-super-secreto-para-desarrollo-min-32caracteres}
      expiration-minutes: 1440

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
