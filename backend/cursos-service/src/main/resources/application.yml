server:
  port: ${PORT:8082}
  address: 0.0.0.0

spring:
  application:
    name: cursos-service
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/cursos_db
    username: ${PGUSER:luxray}
    password: ${PGPASSWORD:luxray_secret_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    cors:
      allowed-origins: "http://localhost:4200,http://localhost:4300,http://127.0.0.1:4200"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

luxray:
  auth:
    # URL interna del auth-service para validar asignaciones docentes.
    url: ${AUTH_URL:http://localhost:8081}
  security:
    jwt:
      secret: ${JWT_SECRET:luxray-jwt-super-secreto-para-desarrollo-min-32caracteres}
  storage:
    # S3-compatible.
    #   endpoint (S3_ENDPOINT):       interno; solo lo usa el backend
    #                                 (en Docker: http://s3:9000).
    #   public-endpoint (S3_PUBLIC_ENDPOINT): con el que se firman las URLs
    #                                 que abrirá el navegador/PWA. Debe ser
    #                                 alcanzable desde fuera de Docker:
    #                                 http://localhost:9000 (mismo PC) o
    #                                 http://<IP-del-PC>:9000 (teléfono/WiFi).
    #                                 Si se omite se usa S3_ENDPOINT (AWS real).
    endpoint:          ${S3_ENDPOINT:}
    public-endpoint:   ${S3_PUBLIC_ENDPOINT:}
    region:            ${S3_REGION:us-east-1}
    bucket:            ${S3_BUCKET:luxray-evidencias}
    access-key:        ${S3_ACCESS_KEY:}
    secret-key:        ${S3_SECRET_KEY:}
    path-style:        ${S3_PATH_STYLE:true}
    prefix:            ${S3_PREFIX:evidencias}
    # Limpieza periódica de multipart caducados y objetos huérfanos.
    limpieza-intervalo-ms: ${S3_CLEANUP_INTERVAL_MS:900000}
    limpieza-inicio-ms:    ${S3_CLEANUP_INITIAL_DELAY_MS:60000}
  chat:
    # Origen del frontend (mismo valor de FRONTEND_URL que el gateway).
    allowed-origins: ${FRONTEND_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
