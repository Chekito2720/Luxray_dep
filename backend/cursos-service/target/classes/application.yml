server:
  port: 8082

spring:
  application:
    name: cursos-service
  datasource:
    url: jdbc:postgresql://localhost:5432/cursos_db
    username: luxray
    password: luxray_secret_2026
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    cors:
      allowed-origins: "http://localhost:4200,http://localhost:4300,http://127.0.0.1:4200"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

luxray:
  security:
    jwt:
      secret: luxray-jwt-super-secreto-para-desarrollo-min-32caracteres

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
