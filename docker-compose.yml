# ============================================================
# LuxRay — Docker Compose
# Levanta: 3 PostgreSQL + Eureka + Gateway + 4 microservicios
#          + S3 emulado (evidencias) + Frontend PWA (nginx)
#
#   docker compose up -d --build     → enciende todo
#   docker compose logs -f           → ver logs
#   docker compose stop              → apagar (conserva datos)
# ============================================================

services:

  # ───── Bases de datos PostgreSQL ─────
  auth-db:
    image: postgres:16
    container_name: luxray-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: luxray
      POSTGRES_PASSWORD: luxray_secret_2026
    ports:
      - "5433:5432"
    volumes:
      - auth-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxray"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [luxnet]

  cursos-db:
    image: postgres:16
    container_name: luxray-cursos-db
    environment:
      POSTGRES_DB: cursos_db
      POSTGRES_USER: luxray
      POSTGRES_PASSWORD: luxray_secret_2026
    volumes:
      - cursos-db-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxray"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [luxnet]

  analytics-db:
    image: postgres:16
    container_name: luxray-analytics-db
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: luxray
      POSTGRES_PASSWORD: luxray_secret_2026
    ports:
      - "5434:5432"
    volumes:
      - analytics-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxray"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [luxnet]

  # ───── Service Discovery (Eureka) ─────
  discovery-service:
    build:
      context: ./backend
      dockerfile: ./discovery-service/Dockerfile
    container_name: luxray-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [luxnet]

  # ───── API Gateway ─────
  api-gateway:
    build:
      context: ./backend
      dockerfile: ./api-gateway/Dockerfile
    container_name: luxray-gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      # Dentro de la red de Docker el search-service no está en localhost
      SEARCH_URL: http://search-service:8084
    depends_on:
      discovery-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [luxnet]

  # ───── Auth microservice ─────
  auth-service:
    build:
      context: ./backend
      dockerfile: ./auth-service/Dockerfile
    container_name: luxray-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      # Secreto compartido por los servicios que validan JWT (solo desarrollo)
      JWT_SECRET: luxray-jwt-secret-para-docker-compose-no-usar-en-produccion
      # Las cuentas demo solo se habilitan en el entorno local de desarrollo.
      DISABLE_SEED_ACCOUNTS: "false"
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks: [luxnet]

  # ───── Cursos microservice ─────
  cursos-service:
    build:
      context: ./backend
      dockerfile: ./cursos-service/Dockerfile
    container_name: luxray-cursos
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cursos-db:5432/cursos_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: luxray-jwt-secret-para-docker-compose-no-usar-en-produccion
      # Almacenamiento S3 emulado (evidencias de práctica)
      #   S3_ENDPOINT        = nombre INTERNO de Docker; lo usa solo el backend.
      #   S3_PUBLIC_ENDPOINT = host que verá el NAVEGADOR al abrir una URL
      #                        prefirmada. Sin esto las fotos no se ven:
      #                        "s3" no existe fuera de la red de Docker.
      #                        Apunta al Nginx del FRONTEND (puerto 4200), que
      #                        proxifica /luxray-evidencias/* -> s3:9000/... conservando
      #                        path y Host → la firma SigV4 valida en s3rver.
      #                        - misma PC:      http://localhost:4200
      #                        - universidad:   http://10.13.58.24:4200
      #                          (WiFi de la escuela; tu IP actual)
      #   S3_ACCESS_KEY/S3_SECRET_KEY = credenciales que acepta s3rver
      #                        (su cuenta por defecto es S3RVER / S3RVER).
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://10.13.58.24:4200}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-S3RVER}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-S3RVER}
      S3_BUCKET: luxray-evidencias
      S3_PATH_STYLE: "true"
    depends_on:
      discovery-service:
        condition: service_healthy
      cursos-db:
        condition: service_healthy
      s3:
        condition: service_started
    ports:
      - "8082:8082"
    networks: [luxnet]

  # ───── Analytics microservice ─────
  analytics-service:
    build:
      context: ./backend
      dockerfile: ./analytics-service/Dockerfile
    container_name: luxray-analytics
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://analytics-db:5432/analytics_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: luxray-jwt-secret-para-docker-compose-no-usar-en-produccion
      # El WebClient llama al gateway por la red interna de Docker
      LUXRAY_GATEWAY_URL: http://api-gateway:8080
    depends_on:
      discovery-service:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks: [luxnet]

  # ───── Search microservice ─────
  search-service:
    build:
      context: ./backend
      dockerfile: ./search-service/Dockerfile
    container_name: luxray-search
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      # Solo para poblar los índices demo en desarrollo; en producción es false.
      SEARCH_REINDEX_ENABLED: "true"
    depends_on:
      discovery-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks: [luxnet]

  # ───── S3 emulado (evidencias de práctica) ─────
  s3:
    build:
      context: ./docker/s3rver
    container_name: luxray-s3
    ports:
      - "9000:9000"
    volumes:
      - s3-data:/s3
    networks: [luxnet]

  # ───── Frontend PWA (Angular + nginx) ─────
  frontend:
    build:
      context: ./frontend-web
      args:
        # URL del gateway. Usamos "/api" RELATIVA: el Nginx del contenedor
        # proxifica /api -> api-gateway:8080, así funciona en cualquier
        # máquina/IP (universidad, casa, otra WiFi) sin recompilar. En Vercel
        # se inyecta API_URL=https://...onrender.com/api por variable de entorno.
        API_URL: /api
    container_name: luxray-front
    depends_on:
      - api-gateway
    ports:
      - "4200:80"
    networks: [luxnet]

  # ───── Elasticsearch ─────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: luxray-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=luxray-cluster
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - luxnet
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  auth-db-volume:
  cursos-db-volume:
  analytics-db-volume:
  elasticsearch_data:
  s3-data:

networks:
  luxnet:
    driver: bridge
